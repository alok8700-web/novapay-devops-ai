{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}-alerts
  labels:
    {{- toYaml .Values.monitoring.prometheusRule.labels | nindent 4 }}
spec:
  groups:
    - name: {{ .Chart.Name }}.rules
      rules:
        - alert: NovaPayAPIDown
          expr: absent(up{service="novapay-service"})
          for: 1m
          labels:
            severity: critical
            service: novapay-api
          annotations:
            summary: "NovaPay API is down"
            description: "No NovaPay API instances are being monitored by Prometheus."

        - alert: NovaPayHigh5xxErrorRate
          expr: |
            (
              sum(rate(novapay_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(novapay_http_requests_total[5m])), 0.001)
            ) > 0.05
            and
            sum(rate(novapay_http_requests_total[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            service: novapay-api
          annotations:
            summary: "NovaPay HTTP 5xx error rate is high"
            description: "More than 5% of requests are returning server errors for at least 5 minutes."

        - alert: NovaPayHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(novapay_http_request_duration_seconds_bucket[5m])
              )
            ) > 1
          for: 5m
          labels:
            severity: warning
            service: novapay-api
          annotations:
            summary: "NovaPay p95 latency is high"
            description: "The estimated 95th-percentile HTTP request latency has exceeded 1 second for at least 5 minutes."

        - alert: AIOpsCriticalIncident
          expr: increase(aiops_incident_total{severity="CRITICAL"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
            service: novapay-aiops
          annotations:
            summary: "AIOps detected a critical incident"
            description: "The NovaPay AIOps agent detected at least one critical incident in the last 5 minutes."

        - alert: AIOpsWarningIncident
          expr: increase(aiops_incident_total{severity="WARNING"}[5m]) > 0
          for: 2m
          labels:
            severity: warning
            service: novapay-aiops
          annotations:
            summary: "AIOps detected a warning incident"
            description: "The NovaPay AIOps agent detected at least one warning incident in the last 5 minutes."
{{- end }}
