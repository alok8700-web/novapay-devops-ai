{{- if and .Values.aiops.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: {{ .Chart.Name }}-aiops

  labels:
    {{- toYaml .Values.monitoring.serviceMonitor.labels | nindent 4 }}

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-aiops

  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
