name: NovaPay CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: alokdocker8700/novapay

jobs:
  aiops-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiops-agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aiops-agent/requirements.txt

      - name: Install AIOps Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AIOps Unit Tests
        run: PYTHONPATH=. python -m pytest -p no:cacheprovider -v tests

  test-build-push:
    needs: aiops-unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm install

      - name: Install Project Dependencies
        run: npm run install:all

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once and keep the image local until the security gate passes.
      # This preserves the immutable Git SHA tag used by the GitOps flow.
      - name: Build Docker Image for Security Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push only after Trivy passes. No image is published when the scan fails.
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          set -e
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint helm/novapay

      - name: Render Helm Chart
        run: helm template novapay helm/novapay > /tmp/novapay-rendered.yaml

      - name: Validate Rendered Helm Manifests
        run: |
          grep -q 'kind: Deployment' /tmp/novapay-rendered.yaml
          grep -q 'kind: Service' /tmp/novapay-rendered.yaml
          grep -q 'kind: Ingress' /tmp/novapay-rendered.yaml
          grep -q 'image: "alokdocker8700/novapay:' /tmp/novapay-rendered.yaml
          grep -q 'ingressClassName: alb' /tmp/novapay-rendered.yaml
          grep -q 'devops-skill.xyz' /tmp/novapay-rendered.yaml

      - name: Scan Kubernetes Manifests with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/novapay-rendered.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: misconfig

      # GitOps boundary:
      # CI builds/tests/scans/publishes the immutable image, then updates the
      # desired image tag in Git. Argo CD is responsible for applying that
      # desired state to EKS.
      - name: Update GitOps Image Tag
        if: github.event_name == 'push'
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA}"
          VALUES_FILE="helm/novapay/values.yaml"

          echo "Updating GitOps desired image to: ${IMAGE_NAME}:${IMAGE_TAG}"

          sed -i -E "s|^  tag: .*|  tag: ${IMAGE_TAG}|" "$VALUES_FILE"

          echo "Updated Helm values:"
          grep -A3 '^image:' "$VALUES_FILE"

      - name: Commit GitOps Desired State
        if: github.event_name == 'push'
        run: |
          set -e

          if git diff --quiet -- helm/novapay/values.yaml; then
            echo "No GitOps change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/novapay/values.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA} [skip ci]"
          git push origin main

          echo "GitOps desired state committed and pushed."
