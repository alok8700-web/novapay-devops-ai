apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novapay
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/alok8700-web/novapay-devops-ai.git
    targetRevision: main
    path: helm/novapay

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
